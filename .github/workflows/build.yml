name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Not used today (snBible has no native code, so buildPlugin.sh skips Gradle),
      # but buildPlugin.sh runs Gradle as soon as a native dependency is added.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: ./buildPlugin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: snBible-snplg
          path: build/outputs/*.snplg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/*.snplg
          # Tags containing a hyphen (v1.0.0-rc.1) are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
